<?xml version="1.0" encoding="UTF-8"?>
<!-- The mark on its own, for somewhere that has its own background.

     Not the icon beside it with the plate taken off. That one is drawn to
     be read at the size a launcher draws an icon, where a bar three
     hundredths of the width is a bar; a favicon is read at sixteen pixels,
     and the same bar there is half of one. The plate is what carries it at
     that size, so a mark without a plate has to carry itself: drawn on a
     grid of thirty-two rather than of two hundred and fifty-six, with the
     bar and the dots as thick a part of it as they can be and still read as
     a division sign.

     The same brass and the same three shapes, which is what makes it the
     same mark. Rebuilt by hand, not by `make-icons.sh`: the two differ in
     their proportions rather than in what is in them, so neither is the
     other minus something. 
     The declaration above is not decoration. This comment is long enough
     that `<svg` lands a thousand bytes in, past the window a content
     sniffer looks at, so without it the file is taken for `text/plain`
     and a file manager draws the placeholder it gives anything it cannot
     read. Measured with `file` and with the thumbnailer itself, which
     answered `Unknown image format: text/html`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="obelus-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c6f33"/>
      <stop offset="0.45" stop-color="#e8cf8f"/>
      <stop offset="0.7" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#7d6229"/>
    </linearGradient>
  </defs>
  <g fill="url(#obelus-brass)">
    <circle cx="16" cy="7" r="3.2"/>
    <rect x="3" y="14" width="26" height="4" rx="2"/>
    <circle cx="16" cy="25" r="3.2"/>
  </g>
</svg>
