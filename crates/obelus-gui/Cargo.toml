[package]
name = "obelus-gui"
# Its own, not the workspace's: that one says "terminal", and this is the
# binary for readers who are not in one.
description = "A code editor in a window, with the agent built in."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "obg"
path = "src/main.rs"

# Cargo inherits nothing here on its own; every member says it.
[lints]
workspace = true

[dependencies]
obelus-app.workspace = true
# For `Layer` alone: the window is told which of them owns the caret, so
# that a caret changing hands is not taken for one that moved.
obelus-component.workspace = true
# The window is the half of Obelus that can own a selection, which is what
# offering several shapes of one copy takes; see `clipboard/`.
obelus-clipboard.workspace = true
obelus-config.workspace = true
obelus-icons.workspace = true
obelus-logging.workspace = true
# Starting another Obelus on another tree, as a task on the one runtime that
# reaps it when it ends -- see `elsewhere`.
obelus-runtime.workspace = true
# How many cells a cell's text takes, which is the application's own answer
# and has to be: the window draws the character where the application put
# the one after it.
obelus-text.workspace = true
obelus-ui.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
clap.workspace = true
cosmic-text.workspace = true
# The type a key arrives as everywhere inside Obelus. Nothing here talks to
# a terminal; what the window produces is translated into this so that the
# twenty-odd files that read a key do not have to know there are two front
# ends.
crossterm.workspace = true
etagere.workspace = true
# The window's own icon, decoded at startup from the same file the resource
# below is built from. See `window.rs`.
image.workspace = true
pollster.workspace = true
ratatui.workspace = true
tokio.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

# Taking the selection rather than handing it to `wl-copy`. The same crate
# winit already has, on purpose: a serial belongs to a connection, so the
# clipboard has to be on the window's own.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client.workspace = true
# And bringing a window forward, which is asked on that same connection for
# the same reason: see `elsewhere/wayland.rs`.
wayland-protocols.workspace = true
x11rb.workspace = true

# How tall the title bar is, which only AppKit can say. See `title.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

# For `GetCaretBlinkTime`: how fast a caret blinks is the one thing of the
# three platforms that has an API rather than a setting to read -- see
# `blink.rs`. And for the title bar's colour, which is DWM's -- see
# `title.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# A build-dependency's `cfg` is the *host's*, which is the right question
# here: this drives a program that only exists on Windows. See `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# What `cargo deb` and `cargo generate-rpm` make of this crate, which is the
# `.deb` and the `.rpm` on a release. Its own package rather than a second
# binary in the other one: `obg` is forty megabytes a reader in a terminal
# has no use for.
#
# The desktop entry and the icon are here and not only in the AppImage,
# because a window with no `.desktop` file beside it is a window a launcher
# cannot start and a taskbar draws without a name.
[package.metadata.deb]
name = "obelus-gui"
maintainer = "Sunli <scott_s829@163.com>"
copyright = "2026 Sunli"
license-file = ["../../LICENSE", "0"]
section = "devel"
priority = "optional"
extended-description = """\
The same code editor as `obelus`, drawn in a window rather than in a \
terminal: the presses a terminal cannot report arrive as themselves, and \
the marks are compiled in rather than guessed at from the reader's font."""
# Two spellings, and they are not a mistake. `target/release` is written
# the plain way because that exact prefix is the one cargo-deb rewrites for
# the target and the profile it was given -- `../../target/release` is not
# it, and packaged whatever an old `cargo build --release` had left lying
# there. Every other path is resolved against this crate's own directory,
# which is what the `../../` is.
assets = [
    ["target/release/obg", "usr/bin/", "755"],
    ["../../contrib/desktop/obelus.desktop", "usr/share/applications/", "644"],
    ["../../contrib/desktop/obelus.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "obelus-gui"
assets = [
    { source = "target/release/obg", dest = "/usr/bin/obg", mode = "755" },
    { source = "contrib/desktop/obelus.desktop", dest = "/usr/share/applications/obelus.desktop", mode = "644" },
    { source = "contrib/desktop/obelus.svg", dest = "/usr/share/icons/hicolor/scalable/apps/obelus.svg", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/obelus-gui/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/obelus-gui/README.md", mode = "644", doc = true },
]
