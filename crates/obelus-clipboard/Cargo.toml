[package]
name = "obelus-clipboard"
description = "The clipboard, and opening a link"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo inherits nothing here on its own; every member says it.
[lints]
workspace = true

[dependencies]
base64.workspace = true
# `without_a_window`, for the programs that are the clipboard on some machines.
obelus-program.workspace = true
open.workspace = true
tracing.workspace = true

# The two platforms whose clipboard is a system service, asked directly:
# `pbpaste` hands over text and nothing else, and `win32yank.exe` is
# something a reader installs for WSL rather than something a Windows
# machine has. See `native.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
