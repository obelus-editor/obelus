[package]
name = "obelus-front"
description = "What Obelus says to whatever draws it, and the parts of Obelus that say it"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo inherits nothing here on its own; every member says it.
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
obelus-app.workspace = true
# The reader's clipboard and browser, for an Obelus on another machine
# that asks for them -- see `client`.
obelus-clipboard.workspace = true
# Where the key for a server is kept.
obelus-logging.workspace = true
# For `Layer` alone: the caret says which of them owns it.
obelus-component.workspace = true
obelus-theme.workspace = true
obelus-ui.workspace = true
# The key a window hears, as it crosses back.
crossterm = { workspace = true, features = ["serde"] }
# For `obelus_app::event::Event`'s documents alone.
obelus-buffer.workspace = true
ratatui.workspace = true
# For what crosses as ratatui writes it -- see `wire`.
ratatui-core = { workspace = true, features = ["serde"] }
hmac.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true

obelus-wire.workspace = true
