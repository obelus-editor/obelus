[package]
name = "obelus-lsp"
description = "Talking to a language server"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo inherits nothing here on its own; every member says it.
[lints]
workspace = true

[dependencies]
obelus-command.workspace = true
obelus-icons.workspace = true
obelus-program.workspace = true
obelus-runtime.workspace = true
obelus-sink.workspace = true
obelus-syntax.workspace = true
obelus-text.workspace = true
anyhow.workspace = true
globset.workspace = true
lsp-types.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
url.workspace = true

# Only for `tests/real_server.rs`, which asks the system whether a server
# process is still there. One question, two ways of putting it, and neither
# platform is made to carry the other's.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true
