[package]
name = "obelus-agent"
description = "Agents: the registry, installing one, and talking to it"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo inherits nothing here on its own; every member says it.
[lints]
workspace = true

[dependencies]
obelus-todo.workspace = true
base64.workspace = true
obelus-git.workspace = true
obelus-jobs.workspace = true
obelus-logging.workspace = true
obelus-program.workspace = true
obelus-runtime.workspace = true
obelus-sink.workspace = true
agent-client-protocol.workspace = true
dirs.workspace = true
flate2.workspace = true
futures.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
zip.workspace = true

# Claiming a conversation is a lock the system holds, so that an Obelus that
# is killed gives it up without having to be asked. One question, two ways of
# putting it, and neither platform is made to carry the other's.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
