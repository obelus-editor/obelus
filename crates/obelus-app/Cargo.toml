[dev-dependencies]
# For the watcher's tests alone, and for one thing they cannot do without
# it: say *what* arrived. `obelus_watch` hands over a path and nothing
# else, which is all Obelus wants and is not enough for a test that has
# to explain why a platform woke the loop -- see `watch.rs`.
notify.workspace = true
# For the remote tests, which stand in for a chat platform and have to be
# handed what one is handed.
obelus-ui.workspace = true
ureq.workspace = true
