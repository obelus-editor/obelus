[package]
name = "obelus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A terminal code reader. It doesn't want you to type."

[[bin]]
name = "ob"
path = "src/main.rs"

# Nothing but cargo's own defaults.
#
# Link-time optimisation and a single codegen unit were here, for a real
# reason: obelus draws the whole screen on every keystroke, and the work
# that takes is spread over a dozen small crates -- the rope, the matcher,
# the diff, the grammars -- so the calls that matter most cross crate
# boundaries, which is what a link-time pass can see through and a
# per-crate one cannot.
#
# What that argument left out is who waits. One reoptimises the whole
# program after every crate is compiled and nothing about it is
# incremental; the other gives up the parallelism of the codegen it would
# otherwise be doing meanwhile. Between them they are minutes on the way to
# running the thing, every time, and the few per cent they buy is not
# something a reader of a file has ever noticed.

[dependencies]
# 0.30 split the backends into separate crates (ratatui-crossterm and friends).
# `crossterm_0_29` pins the backend to the same crossterm we depend on directly
# below: the tree must contain exactly one crossterm, or `KeyEvent` is two
# unrelated types and the mismatch surfaces as an unreadable trait error.
ratatui = { version = "0.30", features = ["crossterm_0_29"] }

# Declared directly, not taken from ratatui's re-export, so the version this
# crate compiles against is stated in one place next to the feature that pins
# ratatui's backend to it.
crossterm = "0.29"


clap = { version = "4", features = ["derive"] }
# The protocol's data types. Writing them by hand would be a lot of typing
# with a lot of chances to get a JSON shape subtly wrong.
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fuzzy matching. `nucleo-matcher` rather than `nucleo`: the latter adds a
# streaming worker on rayon and parking_lot, and obelus matches a list it
# already holds.
nucleo-matcher = "0.3"

# Walking the tree for the file picker, respecting .gitignore.
ignore = "0.4"

# The globs a language server declares for the files it wants to hear about
# before they move. Already in the tree under `ignore`; named here because
# this crate matches patterns of its own against paths, which is a thing to
# say out loud rather than to reach through another crate for.
globset = "0.4"

# The search's patterns. Already in the tree by way of `ignore` and `tokei`,
# so this states a dependency obelus was compiling anyway rather than adding
# one. `default-features = false` with `std`, `perf` and `unicode` kept: what
# is dropped is `logging`, which would put obelus's own tracing output in the
# middle of a frame.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

# Counting the lines of the tree. `default-features = false` drops tokei's
# `cli` feature, which is its own binary's: clap, colored, env_logger and
# num-format, none of which a library call needs. What is left still walks
# the tree with the same `ignore` above, so counting obeys the same
# .gitignore the file list does -- and it is the one dependency here that
# brings a thread pool of its own.
tokei = { version = "14", default-features = false }

# File watching. Its callback runs on its own thread; the debounce thread
# turns that into events on the one channel the main loop reads.
notify = "8"

unicode-linebreak = "0.1"
ropey = "1.6"

# The grammars depend only on `tree-sitter-language`, so they impose no bound
# on the core version and each can move independently of it. `cargo tree -i
# tree-sitter` has to show one version: two would make `Language` two
# different types, and the error says nothing useful about why.
#
# Each is a C parser compiled by its build script, so this list is most of
# obelus's cold build. A language whose files nobody opens is paid for on
# every clean build, which is the reason not to add every grammar that exists.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
# JavaScript's query is also half of TypeScript's and TSX's, and its JSX rules
# are appended to its own, so this one is not optional the way the others are.
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
# C's query is the other half of C++'s, the same way JavaScript's is of
# TypeScript's.
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
# No markdown: it is two grammars, a block one and an inline one, which the
# one-grammar-per-language registry cannot express. It needs the injection
# machinery obelus does not have yet.
unicode-width = "0.2"

anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter-md = "0.5.3"
# Markdown for a terminal: the parse and the layout, not the painting. Its
# `FmtText` is a list of lines of styled compounds, which is exactly the
# structure obelus needs and none of the escape sequences it must not have --
# obelus writes cells, not ANSI. It is on crossterm 0.29, the same one pinned
# above, so there is still one crossterm in the tree.
termimad = "0.35"
base64 = "0.23.1"
# Line diffs whose hunks agree with git's, because it implements the same
# histogram algorithm. What "changed since HEAD" means has to be the same
# answer `git diff` gives, or the markers in the margin are obelus's opinion
# rather than the repository's.
imara-diff = "0.2"
# Git itself, as a library. The alternative is running `git` and parsing what
# it prints for people, which means a process per question and a program that
# has to be installed for obelus to be able to see a repository at all.
# Where a configuration file goes, which is a different answer on every
# platform and one it is not worth being wrong about: a file the reader
# cannot find is a setting that does not exist.
dirs = "7"
# The file's format. Hand-rolling a parser for something that looks like toml
# invites the question "why doesn't a section work", and the answer to
# "is this valid" is not obelus's to own.
toml = "1"

# Editing a file somebody else wrote. The tree's own settings are written by
# hand and committed, so they have comments and an order in them that a
# round trip through a `toml::Table` would throw away -- obelus's own file
# has neither, and is written whole. Already in the tree by way of another
# dependency, so this costs a line rather than a build.
toml_edit = "0.22"
gix = { version = "0.87.1", default-features = false, features = ["attributes", "blame", "status", "revision", "max-performance-safe", "sha1"] }
# What fetches the agent registry, an agent's mark and an agent's archive.
# Async, and on `crate::runtime`, for the one thing blocking HTTP cannot do:
# a reader who presses escape during a download has asked for it to stop,
# and a `JoinHandle::abort` is the only thing that stops it.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    # Forty agent marks come off one host, which is what multiplexing is
    # for: one connection instead of a queue. `h2` is five CPU-seconds in a
    # build of four hundred and forty, compiled in parallel with everything
    # else -- it costs no wall time and buys the one fetch that is a batch.
    "http2",
] }
# Checking an archive against the checksum the registry gave for it. Half the
# registry's entries carry one; those get verified before anything is unpacked.
sha2 = "0.11.0"
# Unpacking what was downloaded: `.tar.gz` is what nearly every agent ships,
# `.zip` is most of the rest, and `.tar.bz2` -- four entries -- says so rather
# than pretending.
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Handing pixels to the terminal: kitty's graphics protocol, iTerm2's inline
# images, or sixels, whichever the terminal answers that it speaks. Its
# default features probe for chafa, a C library, and its build script *fails*
# where chafa is not installed -- so those are off. What chafa would have
# added is the half-block fallback, and obelus falls back to a glyph instead:
# a sixteen-pixel mark pressed into two half-block cells is four coloured
# squares.
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
# The pixels themselves. Only png, because obelus decodes no image files at
# all -- this is the buffer type `ratatui-image` takes.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The registry's marks are SVG, so something has to draw them. Without its
# default features: no text, no system fonts, no raster images inside an SVG.
# These are single-path drawings, and the text support alone is a font stack
# -- fontdb, rustybuzz, ttf-parser -- for glyphs that never appear.
resvg = { version = "0.48.1", default-features = false }
agent-client-protocol = "2.1.0"
# The channels and streams the protocol's own crate speaks. Runtime-agnostic,
# which is why they stay here with tokio driving them.
futures = "0.3.34"
# The runtime obelus's waiting is done on -- one of them, in `src/runtime.rs`,
# for the agent's connection, the tools obelus offers it, a language server's
# pipe and the clock behind an animation. Work-stealing because a language
# server's answer is parsed where it is read and a big one takes twenty
# milliseconds, which on one thread would stall everything else waiting here.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "process",
    "io-util",
    "time",
    "macros",
] }
access_log_parser = "0.11"

# What carries the tools obelus offers an agent. A router for one route,
# most of which is unused -- but a tool call has to wait for the reader to
# answer a card, and an `await` on that costs no thread where a blocking
# server would park one. rmcp's transport hands over a `tower` service, so
# the two were chosen together.
axum = "0.8"

# The protocol itself: the types, the handshake, the error codes, and
# `#[tool]` -- which generates a tool's JSON Schema from the function
# signature, so the two cannot drift. Written by hand they are two things,
# and changing one and forgetting the other is a mistake nothing catches.
# The same reason `lsp-types` is here.
rmcp = { version = "3.4", features = ["transport-streamable-http-server"] }

# The schemas `#[tool]` builds from those signatures. Already in the tree by
# way of rmcp; declared here because obelus derives on its own types.
schemars = "1"

# Handing a URL to whatever the reader opens URLs with, for an agent that
# needs them to sign in somewhere. Three crates, none of them large.
#
# Not three lines of `Command::new("xdg-open")`, for reasons that are
# obelus's own rather than general: it silences the child's stdin, stdout
# and stderr, and obelus lives in the alternate screen where a launcher
# that prints one line has torn the page up. It tries `gio`, `gnome-open`
# and `kde-open` where `xdg-open` is not installed. And it knows WSL, where
# a terminal program wanting the Windows browser is exactly the case a
# hand-rolled `xdg-open` gets wrong.
#
# Not `webbrowser`, which pulls `url` and with it `idna` and the whole ICU
# normaliser -- a dozen crates to open a link.
open = "5"


[dev-dependencies]
serde_json = "1"
# A blocking HTTP client, for the tests that talk to the server obelus runs
# for an agent. obelus itself fetches with `reqwest` on its own runtime;
# a test is a synchronous function and wants neither.
ureq = "3.4.1"

